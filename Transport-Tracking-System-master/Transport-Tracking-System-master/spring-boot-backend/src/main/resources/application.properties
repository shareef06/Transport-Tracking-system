# ========================================================
# Transport Tracking System - Spring Boot Application Configs
# ========================================================

# Server configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database configuration (update variables with your local database values)
spring.datasource.url=jdbc:mysql://localhost:3306/transport_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging configurations
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# JWT Configurations (custom properties)
jwt.secret=SecretTransitTrackingSystemSecretKey2026MasterDesign
jwt.expiration=864000000
